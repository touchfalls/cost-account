[project]
name = "cost-account"
version = "0.1.0"
description = "Fortnite Locker Account Value Evaluator Telegram Bot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.3.0",
    "aiohttp>=3.9.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
